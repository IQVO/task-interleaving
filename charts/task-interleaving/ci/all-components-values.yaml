# Used by `helm lint` / `ct lint`: every optional value and component set at
# once (api + mcp + projector + reports + frontend).
database:
  existingSecret: "task-interleaving-db"
kafka:
  brokers: "kafka-0.kafka.warehouse-systems.svc.cluster.local:9092,kafka-1.kafka.warehouse-systems.svc.cluster.local:9092"
config:
  logLevel: "debug"
  outboxRelayInterval: "500ms"
  outboxMaxAttempts: 20
  hintExpiryInterval: "2s"
  shutdownDrainDelay: "5s"
  fulfillmentConsumerGroup: "task-interleaving-fulfillment"
  layoutConsumerGroup: "task-interleaving-layout"
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/task-interleaving
      pathType: PathPrefix
kongPlugins:
  cors:
    enabled: true
    origin: "http://localhost"
  prometheus:
    enabled: true
  opentelemetry:
    enabled: true
autoscaling:
  api:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
analytics:
  enabled: true
  url: "postgres://u@example.invalid:5432/analytics"
  consumerGroup: "task-interleaving-analytics"
frontend:
  enabled: true
