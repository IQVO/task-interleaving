{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through Kong (the same fleet decision as the MCP route: Kong
config lives in the application charts, not warehouse-infra Terraform).

Host contract: /api/a2a/<context> -> Service <context>-a2a:8093, prefix
rewritten to / so the JSON-RPC endpoint (served at / and /a2a) and the Agent
Card (/.well-known/agent-card.json) stay reachable under the same prefix;
healthz deliberately stays off the host (a Kubernetes probe concern).

Plugins: this chart's cors + prometheus + opentelemetry KongPlugins (see
kong-plugins.yaml), attached by annotation. NO auth plugin: endpoints are
unauthenticated by fleet-wide decision.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "task-interleaving.a2aFullname" . }}
  labels:
    {{- include "task-interleaving.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "task-interleaving.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "task-interleaving.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
