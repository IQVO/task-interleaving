# Default values for task-interleaving.
#
# This chart deploys the ONLY runtime the service has (ADR 0006): real
# Postgres and real Kafka. There is no in-memory mode and no consumer that is
# off by default, so a render without a database source or without brokers
# fails with a message naming the value (templates/_helpers.tpl).

replicaCount: 1

# The image is NEVER pulled from a registry in the local kind cluster: it is
# built from the local checkout and side-loaded with `kind load docker-image`
# (warehouse-infra overrides repository and tag with a content-derived
# local-<hash> tag). `pullPolicy: IfNotPresent` is required there, or the
# kubelet tries to pull from Docker Hub and ImagePullBackOffs.
image:
  repository: warehouse/task-interleaving
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# The service writes nothing to disk (logs go to stdout, the migrations are
# embedded in the binary), so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: task-interleaving.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Same shape as every other chart in this fleet. warehouse-infra turns it on
# and supplies the Kong Gateway parentRef + path (/api/task-interleaving,
# the second server of apis/openapi.yaml).
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to the
# HTTPRoute above via the konghq.com/plugins annotation. Fleet decision
# 2026-10-13: Kong configuration belongs to the application charts, not
# warehouse-infra Terraform. Defaults off; warehouse-infra's values switch
# them on. NO auth plugin here, ever.
kongPlugins:
  cors:
    enabled: false
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), disabled by default so nothing
# changes replica behaviour silently. When enabled, the Deployment's
# replicaCount is omitted so the HPA is the sole owner of .spec.replicas.
# N>1 is safe for the outbox relay (FOR UPDATE SKIP LOCKED), the
# version-guarded policy and station-trip writes and the two consumers (stable
# consumer groups, dedupe on the CloudEvents id in the same transaction); it
# has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/main.go header). Every key maps 1:1 to
# one env var. The *_MODE variables are NEVER rendered: they default to kafka
# and the binary rejects "permissive" at boot (ADR 0006).
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  # Empty = not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: how many times one outbox row may fail before the
  # relay excludes it from claims, so a poison row cannot block the relay
  # forever. 0 = unlimited.
  outboxMaxAttempts: 20
  # HINT_EXPIRY_INTERVAL: how often the expiry worker sweeps for hints past
  # their expires_at (Go duration, "5s", "500ms"). Empty = not rendered; the
  # binary defaults to 5s. A malformed value is a BOOT ERROR, not a default.
  hintExpiryInterval: ""
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the
  # listener. Empty = not rendered; the binary defaults to 5s.
  shutdownDrainDelay: ""
  # The STABLE consumer group ids of the two consumers (MANDATORY: the
  # binary exits at boot without them, and the chart refuses to render with
  # an empty one). They are fixed names, not derived from the pod, so a
  # rescheduled pod resumes from its committed offsets. Do not rename them in
  # a running environment: a new group id re-reads the topic from the start.
  fulfillmentConsumerGroup: "task-interleaving-fulfillment"   # FULFILLMENT_CONSUMER_GROUP (warehouse.fulfillment.events)
  layoutConsumerGroup: "task-interleaving-layout"             # LAYOUT_CONSUMER_GROUP (warehouse.facility.events)

# MANDATORY: the chart refuses to render unless database.url or
# database.existingSecret is set (templates/_helpers.tpl:
# task-interleaving.requireDatabase).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup step,
  # never for the runtime pgxpool, which always uses existingSecretKey /
  # DATABASE_URL. golang-migrate takes a session-scoped pg_advisory_lock that
  # PgBouncer's transaction pooling cannot honour. `optional: true` on the
  # rendered secretKeyRef so a secret without this key still starts the pod:
  # the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# MANDATORY: KAFKA_BROKERS (comma-separated). No default on purpose: the
# service runs on real Kafka only (ADR 0006) and the chart refuses to render
# without brokers. Produced topics: warehouse.task-interleaving.events and
# warehouse.task-interleaving.analytics; consumed: warehouse.fulfillment.events
# and warehouse.facility.events. The service never creates topics through an
# admin API: the relay's writer auto-creates the service's own topics on first
# write (AllowAutoTopicCreation, the fleet convention: the cluster broker
# creates every business topic on first write and infrastructure declares
# none), and /readyz does not wait for any topic. A consumed topic that does
# not exist yet (its producer has not written) shows as consumer retry logs,
# not as unreadiness.
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list.
extraEnv: []

# The Postgres dial (migrations + ping) at boot is wrapped in a bounded retry
# (internal/bootretry: 5 attempts, 15 s of backoff in total). periodSeconds *
# failureThreshold of the startup probe gives a ~60 s window before the
# kubelet gives up. Once it succeeds, liveness takes over (/healthz is
# liveness only). Readiness uses /readyz, which checks the drain gate,
# Postgres AND that a Kafka broker answers a metadata request (reachability
# only, never topics; a missing consumed topic is consumer retry logs, not
# unreadiness; the verdict is cached for 3 s): a Kafka outage takes the
# pod out of the Service and a shutdown flips it to not-ready first, both by
# design.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Room for the binary's graceful shutdown (cmd/api serveUntilSignal), which
# stops and awaits its workers one after the other, each bounded by 10s:
# SHUTDOWN_DRAIN_DELAY (default 5s) + HTTP drain (10s) + 2 consumers (2 x 10s)
# + hint-expiry worker (10s) + outbox relay (10s) = 55s in the worst case.
# Keep it above that sum if you raise config.shutdownDrainDelay.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Optional components, each its OWN Deployment + Service (component label).
# All default OFF: a default render is the api alone.
# ---------------------------------------------------------------------------

# cmd/mcp (ADR 0007): the read-only MCP server (Streamable HTTP on /mcp). It
# reads the OLTP database through the existing queries and writes nothing: no
# outbox relay, no consumer, no Kafka. No auth, by fleet decision: the
# in-cluster ClusterIP boundary is the access control.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure: /api/mcp/task-interleaving -> Service :8090, prefix
  # rewritten to /mcp. Needs the Gateway parentRef from warehouse-infra.
  route:
    enabled: false
    path: "/api/mcp/task-interleaving"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# The analytics read side (ADR 0008): ti-projector (the only writer of the
# analytical database, fed by warehouse.task-interleaving.analytics) and
# ti-reports (read-only: GET /reports/hint-adoption and /reports/freshness).
# The analytical database is SEPARATE from the OLTP one. MANDATORY when
# enabled: analytics.url or analytics.existingSecret. The projector reuses
# kafka.brokers; ti-reports never dials Kafka.
analytics:
  enabled: false
  url: ""
  existingSecret: ""
  existingSecretKey: "ANALYTICS_DATABASE_URL"
  # STABLE group id of the projector (ANALYTICS_CONSUMER_GROUP). Do not rename
  # it in a running environment: a new group id re-reads the topic from the start.
  consumerGroup: "task-interleaving-analytics"
  projector:
    replicaCount: 1
    adminAddr: ":8091"               # ADMIN_ADDR: /healthz and /readyz
    adminPort: 8091
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []
  reports:
    replicaCount: 1
    httpAddr: ":8092"                # HTTP_ADDR
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []

# web/ (task_interleaving_mfe): the Module Federation remote served by its own
# nginx pod, reached through warehouse-infra's Nginx web gateway at
# /mfes/task-interleaving/. Never routed by this chart; ClusterIP only.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/task-interleaving-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
